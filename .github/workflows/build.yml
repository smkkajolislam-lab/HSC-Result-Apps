                          {"ফলাফল নিয়ে আপত্তি থাকলে?", "বোর্ডের নির্ধারিত নিয়মে পুনর্নিরীক্ষণের আবেদন করা যায়। তারিখ ও ফি বোর্ডের অফিশিয়াল বিজ্ঞপ্তি থেকে দেখে নিন।"},
                          {"এটা কি অফিশিয়াল অ্যাপ?", "না, এটি একটি সহায়ক গাইড। রেজাল্ট বোর্ডের অফিশিয়াল সাইটেই দেখুন এবং রোল-রেজি অন্য কোনো সাইটে দেবেন না।"}};
                  for (int i = 0; i < faq.length; i++) {
