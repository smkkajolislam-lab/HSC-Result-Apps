      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HSC-Result-2026.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSC-Result-APK
          path: HSC-Result-2026.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" HSC-Result-2026.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HSC Result App v${{ github.run_number }}" \
            --notes "Debug-signed APK. Download HSC-Result-2026.apk and install."
