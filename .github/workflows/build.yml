                      }
                      c.addView(row, lp(0));
                  }
                  c.addView(tv("GPA হলো বিষয়গুলোর পয়েন্টের গড়। ঐচ্ছিক বিষয়ের ক্ষেত্রে নির্দিষ্ট নিয়মে অতিরিক্ত পয়েন্ট যোগ হয়। কোনো বিষয়ে F থাকলে সামগ্রিক ফলাফল প্রভাবিত হয়।", 14, MUTED, false), lp(10));

                  c = section("সার্ভার ধীর বা সাইট না খুললে");
                  bullets(c, new String[]{
                          "দুটো অফিশিয়াল সাইট পালা করে চেষ্টা করুন।",
                          "বারবার রিফ্রেশ না করে ২–৫ মিনিট পর আবার দিন। প্রথম ঘণ্টায় চাপ সবচেয়ে বেশি থাকে।",
