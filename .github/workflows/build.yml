                  promo("✨ আরও দরকারি লিংক দেখুন", PROMO2);

                  root.addView(tv("সাধারণ প্রশ্নোত্তর", 20, TXT, true), lp(28));
                  String[][] faq = {
                          {"SMS-এ HSC রেজাল্ট কীভাবে দেখব?", "HSC, বোর্ডের প্রথম তিন অক্ষর, রোল নম্বর ও সাল স্পেস দিয়ে লিখে 16222 নম্বরে পাঠান। যেমন: HSC DHA 123456 2026।"},
                          {"রেজিস্ট্রেশন নম্বর ভুলে গেলে কী করব?", "প্রবেশপত্র বা কলেজের রেকর্ড দেখুন, না পেলে কলেজে যোগাযোগ করুন। SMS-এ শুধু রোল দিয়েও সংক্ষিপ্ত ফলাফল পাওয়া যায়।"},
